name: Deploy Backend

on:
  push:
    branches:
      - branch1
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to air-backend
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail
            export DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            export DEPLOY_BRANCH="${{ github.ref_name }}"
            export GUNICORN_SERVICE="${{ secrets.GUNICORN_SERVICE }}"
            cd "${DEPLOY_PATH}"
            git fetch origin "${DEPLOY_BRANCH}"
            git checkout "${DEPLOY_BRANCH}"
            git pull --ff-only origin "${DEPLOY_BRANCH}"
            bash backend/scripts/deploy.sh

      - name: Verify API
        run: |
          HOST="${{ secrets.SERVER_HOST }}"
          echo "Checking http://${HOST}/api/air-quality/devices/"
          BODY=$(curl -sf --max-time 30 "http://${HOST}/api/air-quality/devices/")
          echo "${BODY}"
          echo "${BODY}" | grep -q "lands-building"
          echo "Checking fresh AQI for lands-building..."
          AQI_JSON=$(curl -sf --max-time 30 "http://${HOST}/api/air-quality/device/aqi/?device_id=lands-building")
          echo "${AQI_JSON}"
          echo "${AQI_JSON}" | grep -q '"aqi"'
          TS=$(echo "${AQI_JSON}" | python3 -c "import sys,json; print(json.load(sys.stdin)['timestamp'][:10])")
          echo "AQI date: ${TS}"
          if [[ "${TS}" < "2026-07-18" ]]; then
            echo "WARNING: AQI timestamp still looks stale (${TS}). Check InfluxDB / deploy."
            exit 1
          fi
