name: air_quality_monitor
description: A modern air quality monitoring mobile application.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Styling
  cupertino_icons: ^1.0.2
  google_fonts: ^8.1.0
  fl_chart: ^1.2.0
  carousel_slider: ^5.1.2
  lottie: ^3.3.3

  # State Management
  provider: ^6.0.0

  # API & Networking
  http: ^1.1.0
  dio: ^5.3.1
  retrofit: ^4.0.0
  
  # Local Storage & Database
  shared_preferences: ^2.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # JWT & Auth
  flutter_secure_storage: ^10.1.0
  jwt_decoder: ^2.0.1
  json_annotation: ^4.9.0

  # Geolocation
  geolocator: ^14.0.2
  google_maps_flutter: ^2.5.0

  # Notifications
  firebase_core: ^4.8.0
  firebase_messaging: ^16.2.1
  flutter_local_notifications: ^21.0.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.0.0
  connectivity_plus: ^7.1.1
  logger: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mockito: ^5.4.0
  build_runner: ^2.4.0
  json_serializable: ^6.8.0
  retrofit_generator: ^8.0.0
  hive_generator: ^2.0.0

dependency_overrides:
  firebase_messaging_web: ^4.1.6

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie/
    - assets/colors/
